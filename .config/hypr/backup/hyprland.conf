#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    on_focus_under_fullscreen = 0
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru,ee
    kb_options = grp:alt_shift_toggle
    repeat_rate = 35
    repeat_delay = 350

    follow_mouse = 1
    sensitivity = -0.2
    scroll_factor = 2.5
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, C, forcekillactive
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, X, togglefloating,
#bind = $mainMod, SPACE, exec, $menu --style /home/harid/.config/wofi/style.css
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, W, exec, LIBVA_DRIVER_NAME=radeonsi MOZ_DISABLE_RDD_SANDBOX=1 waterfox 
bind = $mainMod, F, fullscreen
#bind = , Print, exec, grim -g "$(slurp -d)" - | wl-copy
bind = , Print, exec, grimblast --notify copysave area ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png
bind = $mainMod, V, exec, copyq show
#bind = , XF86PowerOff, exec, wleave
bind = , XF86PowerOff, exec, $ipc sessionMenu toggle
bind = $mainMod, SPACE, exec, $ipc launcher toggle
bind = $mainMod, S, exec, $ipc controlCenter toggle
bind = $mainMod, comma, exec, $ipc settings toggle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl --player=spotify,vlc,%any next
bindl = , XF86AudioPlay, exec, bash /home/harid/scripts/play-pause.sh
bindl = , XF86AudioPrev, exec, playerctl --player=spotify,vlc,%any previous

# Volume
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindel = , XF86AudioMute, exec, $ipc volume muteOutput
# Microphone
bindel = $mainMod, F1, exec, qs -c noctalia-shell ipc call volume muteInput

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
#gamescope to workspace 10
windowrule = match:class gamescope, workspace 10
misc:size_limits_tiled = true
windowrule {
  name = workspace-AyuGram
  workspace = 2
  match:class = ^(com.ayugram.desktop)$
}

windowrule {
  name = workspace-spotify
  workspace = 2
  match:class = ^(Spotify)$
}

windowrule {
  name = workspace-steam
  workspace = 5
  match:class = ^(steam)$
}

windowrule {
  name = workspace-vesktop
  workspace = 4
  match:class = ^(vesktop)$
}

windowrule {
    name = pwvucontrol-float
    float = on
    size = 800 600
    match:class = ^(com.saivert.pwvucontrol)$
}
windowrule {
    name = copyq-float
    float = on
    match:class = ^(com.github.hluk.copyq)$
}

#waybar layer rules
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.8

#swaync layer rules
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.7


layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.7

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.7
  blur = true
  blur_popups = true
}
